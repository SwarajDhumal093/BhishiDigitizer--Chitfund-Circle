plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.bhishi.digitizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.bhishi.digitizer"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "4.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // Core / UI
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Fingerprint / biometric login
    implementation 'androidx.biometric:biometric:1.1.0'

    // Background reminders (SMS/WhatsApp due-date checks)
    implementation 'androidx.work:work-runtime:2.9.0'

    // Firebase (Auth + Realtime Database)
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'

    // Secure payment checkout (Android Java)
    implementation 'com.razorpay:checkout:1.6.41'

    // QR invite generation + Google Code Scanner for zero-permission QR joining
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // PDF passbook generation
    implementation 'androidx.print:print:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
